apply plugin: 'com.android.application'

android {
    namespace 'com.q50gtr.plus'
    compileSdkVersion 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        applicationId 'com.q50gtr.plus'
        minSdkVersion 15
        targetSdkVersion 28
        versionCode 6
        versionName '0.6'
    }

    signingConfigs {
        debug {
            // Standard Android debug key. Generated by the build tooling,
            // never stored in this repository.
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            // Signed with the same (generated) debug key so that CI can
            // produce an installable, v1/JAR-signed APK without any secret
            // material living in a public repository.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
    }
}

// Intentionally no dependencies: no AndroidX, no support library,
// no Material components. The whole UI is android.graphics.Canvas.
dependencies {
}

// Sources carry Cyrillic labels; never let the platform default encoding decide.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
