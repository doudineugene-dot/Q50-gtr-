name: Build ALP3 Bridge (phone)

# Отдельный, самостоятельный проект под companion/AlpBridge — обычный
# современный Gradle/Kotlin, не связанный со сборкой самого Q50 GTR+
# (build.yml остаётся нетронутым). Собирает только APK, релиз не создаёт:
# publish этого приложения делается вручную, отдельным решением.

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'companion/AlpBridge/**'
      - '.github/workflows/alp-bridge.yml'
  workflow_dispatch: {}

jobs:
  apk:
    name: Q50 ALP3 Bridge — debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: companion/AlpBridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug

      - name: Найти артефакт
        id: find
        run: |
          set -euo pipefail
          # actions/upload-artifact ниже не наследует working-directory
          # этого джоба (defaults.run.working-directory действует только на
          # шаги run:), поэтому путь для него нужен от корня репозитория —
          # ровно это и стоило первой попытке: путь без companion/AlpBridge/
          # был верным здесь и пустым там.
          APK="companion/AlpBridge/$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Собрано: $APK"

      - name: Загрузить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: q50-alp3-bridge-debug
          path: ${{ env.APK }}
          if-no-files-found: error
