name: Codex Phase 1 APK EPK
on:
  push:
    branches: ['codex/**']
    paths: ['codex-phase1/**', '.github/workflows/codex-phase1.yml', 'tools/epktool.py', 'keys/obu_cert.pem']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install pinned tools
        run: |
          sdkmanager 'build-tools;33.0.2' 'platform-tools'
          echo "$ANDROID_SDK_ROOT/build-tools/33.0.2" >> "$GITHUB_PATH"
          python3 -m pip install cryptography==44.0.2
      - name: Host behavior tests and vector captures
        run: bash codex-phase1/test.sh
      - name: Build and verify API 10 APK and EPK
        env:
          KEYSTORE_B64: ${{ secrets.Q50_KEYSTORE_BASE64 }}
          Q50_KEY_ALIAS: ${{ secrets.Q50_KEY_ALIAS }}
          Q50_KEY_PASS: ${{ secrets.Q50_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            umask 077
            export Q50_KEYSTORE="$RUNNER_TEMP/codex-signing.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$Q50_KEYSTORE"
            trap 'rm -f "$Q50_KEYSTORE"' EXIT
          fi
          bash codex-phase1/build.sh
          cat codex-phase1/artifact/BUILD-PROVENANCE.txt >> "$GITHUB_STEP_SUMMARY"
          cat codex-phase1/artifact/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Q50-Codex-Phase1-APK-EPK
          path: codex-phase1/artifact/
          if-no-files-found: error
          retention-days: 90
  emulator:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Q50-Codex-Phase1-APK-EPK
          path: codex-phase1/artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: Nexus S
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: bash codex-phase1/tests/emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Q50-Codex-Phase1-Android-captures
          path: codex-phase1/artifact/android-captures/
          if-no-files-found: error
          retention-days: 90
