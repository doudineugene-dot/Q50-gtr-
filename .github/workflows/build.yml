name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (e.g. v0.6). Leave empty to only build.'
        required: false
        default: ''

jobs:
  apk:
    name: Q50 GTR+ v0.6 APK
    runs-on: ubuntu-latest

    # Only the tag builds publish, and only to this repository's releases.
    permissions:
      contents: write

    env:
      BUILD_TOOLS: "33.0.2"
      APK_NAME: "Q50-GTR-Plus-v0.6.apk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package set still asks for the retired
          # "tools" package, which no longer exists in the repository.
          packages: ''

      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-33" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Locate and rename APK
        id: apk
        run: |
          set -euo pipefail
          BUILT=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$BUILT" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          mkdir -p artifact
          cp "$BUILT" "artifact/${APK_NAME}"
          echo "path=artifact/${APK_NAME}" >> "$GITHUB_OUTPUT"
          ls -l artifact

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"
          # apksigner puts its warnings on stderr; capture both or the check below is blind.
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.apk.outputs.path }}" 2>&1 | tee signature.txt
          # An old DCU verifies JAR (v1) signatures; v2/v3 alone is not enough.
          grep -q "Verified using v1 scheme (JAR signing): true" signature.txt
          # AGP always drops its own marker files under META-INF/, which the
          # JAR signature cannot cover and which Android ignores. Anything
          # else falling outside the signature would be a real problem.
          if grep "not protected by signature" signature.txt | grep -qv "WARNING: META-INF/"; then
            echo "APK payload entries are outside the v1 signature" >&2
            exit 1
          fi
          # Belt and braces: the JAR manifest must really be there.
          unzip -l "${{ steps.apk.outputs.path }}" | grep -E "META-INF/.*\.(RSA|DSA|EC)$"

      - name: APK summary
        run: |
          {
            echo "### Q50 GTR+ v0.6"
            echo ""
            echo "- APK: \`${APK_NAME}\`"
            echo "- Size: $(du -h "${{ steps.apk.outputs.path }}" | cut -f1)"
            echo ""
            echo '```'
            cat signature.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Приборная панель Q50 GTR+ для штатного головного устройства
          Infiniti Q50 2017 (InTouch / DCU Gen1). Экран 840x480, landscape.

          **Прежде чем ставить, прочитайте:**

          - Совместимость с DCU **не проверена** — APK собирается и подписывается,
            но на автомобиль не устанавливался.
          - Данные в приборах **демонстрационные**. Каждое такое значение помечено
            бейджем DEMO. Связи с EcuTek и AirLift ещё нет.
          - LPFP не логируется в текущей конфигурации EcuTek и показывается как
            «НЕТ ДАННЫХ». Turbo Speed отсутствует — он не пишется на этой машине.
          - APK подписан **ключом отладки, который генерируется на раннере заново
            при каждой сборке**. Поставить новую версию поверх старой не получится:
            предыдущую нужно сначала удалить.
          - Интерфейс растягивается на весь экран. На телефоне с соотношением шире
            1.75:1 круглые шкалы будут выглядеть эллипсами — это ожидаемо.

          Подпись: v1 (JAR) + v2, проверяется в CI. Полный вывод apksigner —
          в приложенном `signature.txt`.
          NOTES

          # A tag push names itself; a manual run says which tag to cut, and
          # gh creates that tag on this commit.
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" signature.txt --clobber
          else
            gh release create "$TAG" \
              "${{ steps.apk.outputs.path }}" signature.txt \
              --target "${GITHUB_SHA}" \
              --title "Q50 GTR+ $TAG" \
              --notes-file notes.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Q50-GTR-Plus-v0.6-APK
          path: |
            artifact/*.apk
            signature.txt
          if-no-files-found: error
          retention-days: 90
